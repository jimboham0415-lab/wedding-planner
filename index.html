<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 웨딩홀 비교 대시보드 | Wedding Venue Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK Imports (Cloud Realtime Sync) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = 'wedding-planner-app';

        const firebaseConfig = {
            apiKey: "AIzaSyDJZ8ORckLCEHEIQO0D3r7yHRT99Klp4eU",
            authDomain: "wedding-planner-f2386.firebaseapp.com",
            projectId: "wedding-planner-f2386",
            storageBucket: "wedding-planner-f2386.firebasestorage.app",
            messagingSenderId: "408305487217",
            appId: "1:408305487217:web:e9ca479ec55ba138a93ad0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Firebase Auth Error:", e);
            }
        };

        initAuth().then(() => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const sharedDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'venues_collection', 'main_data');
                    onSnapshot(sharedDocRef, (snapshot) => {
                        if (snapshot.exists()) {
                            const cloudData = snapshot.data();
                            if (cloudData && !snapshot.metadata.hasPendingWrites && typeof window.applyCloudData === 'function') {
                                window.applyCloudData(cloudData);
                            }
                            const cloudBadge = document.getElementById('cloudSyncStatus');
                            if (cloudBadge) cloudBadge.innerHTML = '<i class="fa-solid fa-cloud-check text-green-500"></i> 실시간 연동됨';
                        }
                    }, (error) => {
                        console.error("Firestore Listen Error:", error);
                    });
                }
            });
        });

        // 텍스트와 가벼운 링크 데이터만 전송하여 1MB 제한 문제 원천 차단
        window.saveToCloud = async function(dataPackage) {
            if (!auth.currentUser) return true;
            try {
                const sharedDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'venues_collection', 'main_data');
                
                const sanitizeList = (list) => {
                    if (!Array.isArray(list)) return [];
                    return list.map(item => ({
                        id: item.id,
                        name: item.name || '',
                        location: item.location || '',
                        rentalFee: Number(item.rentalFee) || 0,
                        mealCost: Number(item.mealCost) || 0,
                        parking: Number(item.parking) || 0,
                        openDate: item.openDate || '',
                        website: item.website || '',
                        instagram: item.instagram || '',
                        desc: item.desc || '',
                        price: Number(item.price) || 0,
                        rating: item.rating || ''
                    }));
                };

                const cleanData = {
                    list: sanitizeList(dataPackage.venues), 
                    snapList: sanitizeList(dataPackage.snapList),
                    dressList: sanitizeList(dataPackage.dressList),
                    makeupList: sanitizeList(dataPackage.makeupList),
                    trousseauList: sanitizeList(dataPackage.trousseauList),
                    applianceList: sanitizeList(dataPackage.applianceList),
                    ringList: sanitizeList(dataPackage.ringList),
                    checklists: dataPackage.checklists || {},
                    updatedAt: new Date().toISOString() 
                };

                await setDoc(sharedDocRef, cleanData);
                return true;
            } catch (err) {
                console.error("Cloud Save Failed:", err);
                return false;
            }
        };
    </script>
    
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #FAF7F3;

        .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere; }

    </style>
</head>

                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/50 p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-trash text-red-500"></i> 정말 삭제할까요?</h3>
            <p id="confirmMsg" class="text-sm text-gray-600"></p>
            <div class="flex justify-end gap-2">
                <button onclick="closeConfirm()" class="px-5 py-2.5 rounded-xl border border-gray-200 text-xs font-bold text-gray-600">취소</button>
                <button onclick="confirmDelete()" class="px-5 py-2.5 rounded-xl bg-red-500 text-white text-xs font-bold">삭제</button>
            </div>
        </div>
    </div>

    <!-- Map Modal -->
    <div id="mapModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4" onclick="if(event.target===this)closeMapModal()">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="flex items-start justify-between p-5 border-b border-amber-100">
                <div>
                    <h3 id="mapTitle" class="font-bold text-lg text-gray-900"></h3>
                    <p id="mapAddress" class="text-xs text-gray-500 mt-0.5"></p>
                </div>
                <button onclick="closeMapModal()" class="text-gray-400 hover:text-gray-700 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <iframe id="mapFrame" class="w-full h-80 bg-gray-100 border-0" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        let currentTab = 'venue';
        let venues = JSON.parse(localStorage.getItem('wedding_venues_db')) || [
            { id: 'v1', name: '까사그랑데 센트럴', location: '서울 서초구 신반포로 176', rentalFee: 8500000, mealCost: 82000, parking: 1200, openDate: '2025-05-01', website: '', instagram: '' },
            { id: 'v2', name: '루이비스 컨벤션', location: '서울 송파구 문정동', rentalFee: 6500000, mealCost: 75000, parking: 1000, openDate: '2025-04-15', website: '', instagram: '' },
            { id: 'v3', name: '더링크 호텔', location: '서울 구로구 경인로 610', rentalFee: 11000000, mealCost: 95000, parking: 1500, openDate: '2025-06-01', website: '', instagram: '' }
        ];

        let snapList = JSON.parse(localStorage.getItem('wedding_snap_db')) || [];
        let dressList = JSON.parse(localStorage.getItem('wedding_dress_db')) || [];
        let makeupList = JSON.parse(localStorage.getItem('wedding_makeup_db')) || [];
        let trousseauList = JSON.parse(localStorage.getItem('wedding_trousseau_db')) || [];
        let applianceList = JSON.parse(localStorage.getItem('wedding_appliance_db')) || [];
        let ringList = JSON.parse(localStorage.getItem('wedding_ring_db')) || [];
        let checklists = JSON.parse(localStorage.getItem('wedding_checklist_db')) || { trousseau: [], appliance: [] };
        let guestCount = Number(localStorage.getItem('wedding_guest_count')) || 100;

        function getTabList(tab) {
            return ({ snap: snapList, dress: dressList, makeup: makeupList, ring: ringList, trousseau: trousseauList, appliance: applianceList })[tab];
        }

        function showToast(title, msg, isError) {
            const toast = document.getElementById('saveToast');
            if (!toast) return;
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function saveVenues() {
            try {
                localStorage.setItem('wedding_venues_db', JSON.stringify(venues));
                localStorage.setItem('wedding_snap_db', JSON.stringify(snapList));
                localStorage.setItem('wedding_dress_db', JSON.stringify(dressList));
                localStorage.setItem('wedding_makeup_db', JSON.stringify(makeupList));
                localStorage.setItem('wedding_trousseau_db', JSON.stringify(trousseauList));
                localStorage.setItem('wedding_appliance_db', JSON.stringify(applianceList));
                localStorage.setItem('wedding_ring_db', JSON.stringify(ringList));
            } catch (e) {}

            if (typeof window.saveToCloud === 'function') {
                window.saveToCloud({ venues, snapList, dressList, makeupList, trousseauList, applianceList, ringList, checklists });
            }
            render();
            return true;
        }

        function manualSaveVenues() {
            saveVenues();
            showToast('데이터 저장 완료', '모든 변경 사항이 저장되었습니다.', false);
        }

        window.applyCloudData = function(cloud) {
            if (cloud.list) venues = cloud.list;
            if (cloud.snapList) snapList = cloud.snapList;
            if (cloud.dressList) dressList = cloud.dressList;
            if (cloud.makeupList) makeupList = cloud.makeupList;
            if (cloud.trousseauList) trousseauList = cloud.trousseauList;
            if (cloud.applianceList) applianceList = cloud.applianceList;
            if (cloud.ringList) ringList = cloud.ringList;
            render();
        };

        function formatKRW(amt) {
            return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(amt || 0);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tabBtn-${tab}`).classList.add('active');

            const isVenue = (tab === 'venue');
            document.getElementById('tabContent-venue').classList.toggle('hidden', !isVenue);
            document.getElementById('tabContent-generic').classList.toggle('hidden', isVenue);

            const titles = { snap: '스냅 업체 리스트', dress: '드레스 숍 리스트', makeup: '메이크업 숍 리스트', ring: '웨딩링 리스트', trousseau: '혼수 리스트', appliance: '가전 리스트' };
            if (!isVenue) document.getElementById('genericTabTitle').innerText = titles[tab] || '업체 리스트';
            render();
        }

        function render() {
            if (currentTab === 'venue') {
                renderSummary();
                renderCards();
                renderTable();
            } else {
                renderGenericGrid();
            }
        }

        function renderSummary() {
            document.getElementById('statTotalVenues').innerText = `${venues.length} 곳`;
            if (!venues.length) return;
            const minM = [...venues].sort((a,b)=>a.mealCost-b.mealCost)[0];
            const minR = [...venues].sort((a,b)=>a.rentalFee-b.rentalFee)[0];
            const maxP = [...venues].sort((a,b)=>b.parking-a.parking)[0];
            document.getElementById('statMinMeal').innerText = formatKRW(minM.mealCost);
            document.getElementById('statMinRental').innerText = formatKRW(minR.rentalFee);
            document.getElementById('statMaxParking').innerText = `${maxP.parking.toLocaleString()} 대`;
        }

        function renderCards() {
            const grid = document.getElementById('venueGrid');
            if (!venues.length) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400 bg-white rounded-2xl">등록된 예식장이 없습니다.</div>`;
                return;
            }
            grid.innerHTML = venues.map(v => `
                <div class="glass-card rounded-3xl p-6 space-y-4 flex flex-col justify-between shadow-sm">
                    <div class="space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg text-gray-900">${v.name}</h3>
                                <p class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i>${v.location}</p>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="openVenueModal('${v.id}')" class="w-8 h-8 flex items-center justify-center text-xs bg-amber-50 text-amber-700 rounded-xl hover:bg-amber-100"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="requestDelete('venue', '${v.id}')" class="w-8 h-8 flex items-center justify-center text-xs bg-red-50 text-red-500 rounded-xl hover:bg-red-100"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs pt-2">
                            <div class="bg-amber-50/50 p-2.5 rounded-xl">
                                <span class="text-gray-400 block text-[10px]">대관료</span>
                                <span class="font-bold text-gray-800">${formatKRW(v.rentalFee)}</span>
                            </div>
                            <div class="bg-amber-50/50 p-2.5 rounded-xl">
                                <span class="text-gray-400 block text-[10px]">식대 (1인)</span>
                                <span class="font-bold text-amber-600">${formatKRW(v.mealCost)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-xs text-gray-500 pt-3 border-t border-amber-100">
                        <span><i class="fa-solid fa-square-parking text-amber-500 mr-1"></i>${v.parking}대</span>
                        <span>오픈: ${v.openDate || '-'}</span>
                    </div>
                </div>
            `).join('');
        }

        function setGuestCount(val) {
            guestCount = Math.max(0, Number(val) || 0);
            localStorage.setItem('wedding_guest_count', guestCount);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('venueTableBody');
            tbody.innerHTML = venues.map(v => {
                const total = (v.rentalFee || 0) + (v.mealCost || 0) * guestCount;
                return `
                <tr class="hover:bg-amber-50/40 transition">
                    <td class="p-3 font-bold text-gray-900">${v.name}</td>
                    <td class="p-3 text-gray-600">${v.location}</td>
                    <td class="p-3 text-right font-medium">${formatKRW(v.rentalFee)}</td>
                    <td class="p-3 text-right font-medium">${formatKRW(v.mealCost)}</td>
                    <td class="p-3 text-right font-bold text-amber-600">${formatKRW(total)}</td>
                    <td class="p-3 text-center">${v.parking}대</td>
                    <td class="p-3 text-center">
                        <button onclick="openVenueModal('${v.id}')" class="text-xs text-amber-600 font-bold">수정</button>
                        <button onclick="requestDelete('venue', '${v.id}')" class="text-xs text-red-400 font-bold ml-2">삭제</button>
                    </td>
                </tr>
            `}).join('');
        }

        function renderGenericGrid() {
            const list = getTabList(currentTab) || [];
            const grid = document.getElementById('genericGrid');
            if (!list.length) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400 bg-white rounded-2xl">등록된 항목이 없습니다.</div>`;
                return;
            }
            grid.innerHTML = list.map(item => `
                <div class="glass-card rounded-2xl p-5 space-y-3 flex flex-col justify-between shadow-sm">
                    <div>
                        <div class="flex justify-between items-center pb-2 border-b border-amber-100">
                            <h3 class="font-bold text-base text-gray-900">${item.name}</h3>
                            <div class="flex items-center gap-1">
                                <button onclick="openGenericModal('${item.id}')" class="text-xs text-gray-400 hover:text-amber-600 p-1"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="requestDelete('${currentTab}', '${item.id}')" class="text-xs text-gray-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <p class="text-xs text-gray-600 mt-2">${item.desc || '설명 없음'}</p>
                    </div>
                    <div class="pt-3 border-t border-amber-100 flex justify-between items-center">
                        <span class="text-xs text-gray-400">예상 견적:</span>
                        <span class="font-bold text-amber-600 text-sm">${formatKRW(item.price)}</span>
                    </div>
                </div>
            `).join('');
        }

        let pendingDelete = null;
        function requestDelete(tab, id) {
            pendingDelete = { tab, id };
            document.getElementById('confirmMsg').innerText = `정말 삭제하시겠습니까?`;
            const m = document.getElementById('confirmModal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
        function closeConfirm() {
            document.getElementById('confirmModal').classList.add('hidden');
            document.getElementById('confirmModal').classList.remove('flex');
            pendingDelete = null;
        }
        function confirmDelete() {
            if (!pendingDelete) return;
            const { tab, id } = pendingDelete;
            if (tab === 'venue') {
                venues = venues.filter(v => v.id !== id);
            } else {
                let list = getTabList(tab);
                if (list) {
                    const idx = list.findIndex(x => x.id === id);
                    if (idx !== -1) list.splice(idx, 1);
                }
            }
            closeConfirm();
            closeVenueModal();
            closeGenericModal();
            saveVenues();
        }

        function openVenueModal(id = null) {
            const modal = document.getElementById('venueModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('venueDeleteBtn').classList.toggle('hidden', !id);
            if (id) {
                const v = venues.find(x => x.id === id);
                document.getElementById('inputVenueId').value = v.id;
                document.getElementById('inputVenueName').value = v.name;
                document.getElementById('inputVenueLocation').value = v.location;
                document.getElementById('inputVenueRental').value = v.rentalFee;
                document.getElementById('inputVenueMeal').value = v.mealCost;
                document.getElementById('inputParking').value = v.parking;
                document.getElementById('inputOpenDate').value = v.openDate || '';
                document.getElementById('inputVenueWebsite').value = v.website || '';
                document.getElementById('inputVenueInstagram').value = v.instagram || '';
            } else {
                document.getElementById('venueForm').reset();
                document.getElementById('inputVenueId').value = '';
            }
        }
        function closeVenueModal() {
            document.getElementById('venueModal').classList.add('hidden');
            document.getElementById('venueModal').classList.remove('flex');
        }

        function handleVenueFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('inputVenueId').value;
            const data = {
                id: id || ('v_' + Date.now()),
                name: document.getElementById('inputVenueName').value,
                location: document.getElementById('inputVenueLocation').value,
                rentalFee: Number(document.getElementById('inputVenueRental').value),
                mealCost: Number(document.getElementById('inputVenueMeal').value),
                parking: Number(document.getElementById('inputParking').value),
                openDate: document.getElementById('inputOpenDate').value,
                website: document.getElementById('inputVenueWebsite').value,
                instagram: document.getElementById('inputVenueInstagram').value
            };
            if (id) {
                const idx = venues.findIndex(v => v.id === id);
                if (idx !== -1) venues[idx] = data;
            } else {
                venues.push(data);
            }
            closeVenueModal();
            saveVenues();
        }

        function openGenericModal(id = null) {
            const modal = document.getElementById('genericModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('genericDeleteBtn').classList.toggle('hidden', !id);
            if (id) {
                const list = getTabList(currentTab);
                const item = list.find(x => x.id === id);
                document.getElementById('inputGenericId').value = item.id;
                document.getElementById('inputGenericName').value = item.name;
                document.getElementById('inputGenericDesc').value = item.desc || '';
                document.getElementById('inputGenericPrice').value = item.price || 0;
                document.getElementById('inputGenericRating').value = item.rating || '';
                document.getElementById('inputGenericWebsite').value = item.website || '';
                document.getElementById('inputGenericInstagram').value = item.instagram || '';
            } else {
                document.getElementById('genericForm').reset();
                document.getElementById('inputGenericId').value = '';
            }
        }
        function closeGenericModal() {
            document.getElementById('genericModal').classList.add('hidden');
            document.getElementById('genericModal').classList.remove('flex');
        }

        function handleGenericFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('inputGenericId').value;
            const list = getTabList(currentTab);
            const data = {
                id: id || ('item_' + Date.now()),
                name: document.getElementById('inputGenericName').value,
                desc: document.getElementById('inputGenericDesc').value,
                price: Number(document.getElementById('inputGenericPrice').value),
                rating: document.getElementById('inputGenericRating').value,
                website: document.getElementById('inputGenericWebsite').value,
                instagram: document.getElementById('inputGenericInstagram').value
            };
            if (id) {
                const idx = list.findIndex(x => x.id === id);
                if (idx !== -1) list[idx] = data;
            } else {
                list.push(data);
            }
            closeGenericModal();
            saveVenues();
        }

        function exportToStandaloneHtml() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = function() {
            document.getElementById('guestCountInput').value = guestCount;
            render();
        };
    </script>
</body>
</html>
